repos:
  - repo: local
    hooks:
      - id: ruff linting
        name: Python linter
        entry: ruff check
        args: [--fix, --exit-non-zero-on-fix, --force-exclude] # fix what can be fixed
        language: python
        types: [python]

      - id: ruff formating
        name: Python formatting
        entry: ruff format
        args: [--force-exclude]
        language: python
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-yaml
